<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="L'app ufficiale per i gossip di scuola: bacheca post-it, feed shorts, classifica Hipe e archivio con pannello admin." />
    <meta property="og:title" content="Gossip Diano" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/app.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-fallback per GitHub Pages quando viene servito senza build server Vite
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = '';
          link.href = './assets/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = '';
          script.src = './assets/app.js';
          document.body.appendChild(script);
        }
      }, 400);
    </script>
  </body>
</html>
